<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>System Flow — VeriVote Kenya</title>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#030508; font-family:'Segoe UI',sans-serif; }
  #root {
    width:1280px; height:720px; position:absolute; top:0; left:0;
    transform-origin:top left; background:#030508; overflow:hidden;
  }
  canvas { position:absolute; top:0; left:0; width:1280px; height:720px; }
  #ui    { position:absolute; top:0; left:0; width:1280px; height:720px; pointer-events:none; }

  #title {
    position:absolute; top:24px; left:50%; transform:translateX(-50%);
    font-size:32px; font-weight:900; white-space:nowrap; opacity:0; transition:opacity 1s;
    background:linear-gradient(90deg,#4ade80,#22d3ee,#c084fc,#fbbf24);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  #subtitle {
    position:absolute; top:68px; left:50%; transform:translateX(-50%);
    font-size:13px; color:#4b5563; white-space:nowrap; opacity:0; transition:opacity 1s;
  }
  #sovereignty {
    position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
    background:#071a0f; border:1px solid #4ade80; border-radius:8px;
    padding:8px 20px; font-size:11px; color:#4ade80; font-weight:700;
    letter-spacing:.05em; white-space:nowrap; opacity:0; transition:opacity .6s;
  }
  #replay {
    position:absolute; bottom:16px; left:20px;
    background:#1f2937; color:#9ca3af; border:1px solid #374151;
    border-radius:8px; padding:8px 16px; font-size:12px;
    cursor:pointer; pointer-events:all; font-weight:600;
  }
</style>
</head>
<body>
<div id="root">
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="title">VeriVote Kenya — End-to-End Flow</div>
    <div id="subtitle">Every step is cryptographically enforced · No human can alter the result</div>
    <div id="sovereignty">🇰🇪 Sovereign · Open Source · Mathematically Verifiable · Zero Data Egress</div>
    <button id="replay" onclick="init()">↺ Replay</button>
  </div>
</div>
<script>
  const root=document.getElementById('root');
  function fit(){
    const s=Math.min(window.innerWidth/1280,window.innerHeight/720);
    root.style.transform='scale('+s+')';
    root.style.left=((window.innerWidth-1280*s)/2)+'px';
    root.style.top=((window.innerHeight-720*s)/2)+'px';
  }
  window.addEventListener('resize',fit); fit();

  const W=1280,H=720;
  const canvas=document.getElementById('c');
  const ctx=canvas.getContext('2d');
  canvas.width=W; canvas.height=H;

  const STEPS=[
    {label:'KYC\nVerify',    icon:'🪪',color:'#4ade80',desc:'Persona ID\n+ Liveness'},
    {label:'Mint\nSBT',      icon:'⛓️',color:'#60a5fa',desc:'On-chain\nIdentity'},
    {label:'WebAuthn\nLogin',icon:'👆',color:'#34d399',desc:'Biometric\nAuth'},
    {label:'Encrypt\nVote',  icon:'🔒',color:'#22d3ee',desc:'ElGamal\n2048-bit'},
    {label:'Mixnet\nAnon',   icon:'🔀',color:'#818cf8',desc:'Anonymise\nVotes'},
    {label:'Homo.\nTally',   icon:'➕',color:'#fbbf24',desc:'No Decrypt\nNeeded'},
    {label:'Shamir\nCerem.', icon:'🗝️',color:'#c084fc',desc:'3-of-5\nKeyholders'},
    {label:'Declare\nResult',icon:'📢',color:'#4ade80',desc:'Verified\nFinal'},
  ];
  const N=STEPS.length;
  const MARGIN=90;
  const STEP_W=(W-MARGIN*2)/(N-1);
  const CY=360;
  const positions=STEPS.map((_,i)=>({x:MARGIN+i*STEP_W,y:CY}));

  let revealed=new Array(N).fill(false);
  let stepScale=new Array(N).fill(0);
  let stepAlpha=new Array(N).fill(0);
  const beams=[];
  const packets=[];
  const ambientPackets=[];
  const particles=[];

  function spawnP(x,y,color,n=16){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2,s=1+Math.random()*5;
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:.013+Math.random()*.02,size:2+Math.random()*4,color});
    }
  }

  function easeInOut(t){ return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2; }
  function lerp(a,b,t){ return a+(b-a)*t; }

  function drawNode(i,scale,alpha){
    if(alpha<=0) return;
    const {x,y}=positions[i], s=STEPS[i], r=42;
    ctx.save(); ctx.globalAlpha=alpha; ctx.translate(x,y); ctx.scale(scale,scale);
    ctx.shadowBlur=24; ctx.shadowColor=s.color;
    ctx.strokeStyle=s.color; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle=s.color+'22'; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
    ctx.font='22px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowBlur=0; ctx.fillStyle='#fff'; ctx.fillText(s.icon,0,0);
    ctx.fillStyle=s.color; ctx.font='bold 10px sans-serif';
    s.label.split('\n').forEach((l,li)=>ctx.fillText(l,0,r+14+li*13));
    ctx.fillStyle='#4b5563'; ctx.font='9px sans-serif';
    s.desc.split('\n').forEach((l,li)=>ctx.fillText(l,0,-r-18+li*12));
    ctx.restore();
  }

  function drawBeam(b){
    if(b.progress<=0) return;
    const fx=positions[b.from].x,fy=positions[b.from].y;
    const tx=positions[b.to].x;
    const p=easeInOut(b.progress);
    const ex=lerp(fx,tx,p);
    ctx.save(); ctx.shadowBlur=10; ctx.shadowColor=b.color;
    ctx.strokeStyle=b.color; ctx.lineWidth=2; ctx.globalAlpha=0.7;
    ctx.beginPath(); ctx.moveTo(fx,fy); ctx.lineTo(ex,fy); ctx.stroke();
    if(b.progress>0.95){
      ctx.fillStyle=b.color;
      ctx.beginPath(); ctx.moveTo(tx-7,fy-6); ctx.lineTo(tx+1,fy); ctx.lineTo(tx-7,fy+6); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function drawPacket(p,alpha){
    const fx=positions[p.from].x,tx=positions[p.to].x,y=positions[p.from].y;
    const px=lerp(fx,tx,easeInOut(p.progress));
    ctx.save(); ctx.globalAlpha=(alpha||1)*0.9;
    ctx.shadowBlur=14; ctx.shadowColor=p.color; ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(px,y,6,0,Math.PI*2); ctx.fill(); ctx.restore();
  }

  function spawnAmbient(){
    for(let i=0;i<N-1;i++){
      if(revealed[i]&&revealed[i+1]&&Math.random()<0.3){
        ambientPackets.push({from:i,to:i+1,progress:0,color:STEPS[i].color});
      }
    }
  }

  let ambientInterval=null;
  const timers=[];
  function at(ms,fn){ timers.push(setTimeout(fn,ms)); }
  function clearAll(){
    timers.forEach(clearTimeout); timers.length=0;
    if(ambientInterval){ clearInterval(ambientInterval); ambientInterval=null; }
  }
  function show(id){ document.getElementById(id).style.opacity='1'; }
  function hide(id){ document.getElementById(id).style.opacity='0'; }

  function init(){
    clearAll(); beams.length=0; packets.length=0; particles.length=0; ambientPackets.length=0;
    revealed=new Array(N).fill(false);
    stepScale=new Array(N).fill(0); stepAlpha=new Array(N).fill(0);
    ['title','subtitle','sovereignty'].forEach(hide);

    at(400, ()=>{ show('title'); show('subtitle'); });

    STEPS.forEach((_,i)=>{
      at(800+i*600, ()=>{
        revealed[i]=true; spawnP(positions[i].x,positions[i].y,STEPS[i].color,20);
        if(i>0) beams.push({from:i-1,to:i,progress:0,color:STEPS[i].color,done:false});
      });
    });

    at(800+N*600+500, ()=>{
      show('sovereignty');
      ambientInterval=setInterval(spawnAmbient,450);
    });
  }

  let t=0;
  function loop(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#030508'; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#080c14'; ctx.lineWidth=1;
    for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    t++;

    for(let i=0;i<N;i++){
      if(revealed[i]){ stepScale[i]=Math.min(1,stepScale[i]+0.06); stepAlpha[i]=Math.min(1,stepAlpha[i]+0.05); }
      if(stepAlpha[i]>0) drawNode(i,stepScale[i],stepAlpha[i]);
    }

    beams.forEach(b=>{ if(!b.done){ b.progress=Math.min(1,b.progress+0.025); if(b.progress>=1)b.done=true; } drawBeam(b); });

    packets.forEach(p=>{ p.progress=Math.min(1,p.progress+0.04); drawPacket(p,1); });
    for(let i=packets.length-1;i>=0;i--) if(packets[i].progress>=1) packets.splice(i,1);

    ambientPackets.forEach(p=>{ p.progress=Math.min(1,p.progress+0.022); drawPacket(p,0.5); });
    for(let i=ambientPackets.length-1;i>=0;i--) if(ambientPackets[i].progress>=1) ambientPackets.splice(i,1);

    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.life-=p.decay;
      ctx.save(); ctx.globalAlpha=p.life; ctx.fillStyle=p.color;
      ctx.shadowBlur=8; ctx.shadowColor=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); ctx.restore();
    });
    for(let i=particles.length-1;i>=0;i--) if(particles[i].life<=0) particles.splice(i,1);

    requestAnimationFrame(loop);
  }
  loop(); init();
</script>
</body>
</html>
